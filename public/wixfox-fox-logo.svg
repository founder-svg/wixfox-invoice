<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="foxBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#142852" />
    </linearGradient>
    <linearGradient id="foxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <linearGradient id="foxOrangeLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>
    <linearGradient id="foxRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#1A6FD4" />
      <stop offset="100%" stop-color="#4A9FE8" />
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A6FD4" />
      <stop offset="100%" stop-color="#0D4FA0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring Badge -->
  <circle cx="256" cy="256" r="250" fill="url(#foxBgGrad)" stroke="url(#foxRing)" stroke-width="12" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#223E75" stroke-width="4" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Ears Outer -->
  <!-- Left Ear -->
  <polygon points="120,240 100,70 230,150" fill="url(#foxOrange)" />
  <!-- Right Ear -->
  <polygon points="392,240 412,70 282,150" fill="url(#foxOrange)" />

  <!-- Ears Inner (Dark & White Layers) -->
  <polygon points="135,215 125,100 215,160" fill="#0E1E3C" />
  <polygon points="145,210 135,120 205,170" fill="#FFFFFF" opacity="0.9" />

  <polygon points="377,215 387,100 297,160" fill="#0E1E3C" />
  <polygon points="367,210 377,120 307,170" fill="#FFFFFF" opacity="0.9" />

  <!-- Head Base / Forehead -->
  <polygon points="256,150 140,240 256,330 372,240" fill="url(#foxOrange)" />
  <polygon points="256,150 170,225 256,290 342,225" fill="url(#foxOrangeLight)" />

  <!-- Cheeks Outer -->
  <polygon points="140,240 80,310 190,340" fill="url(#foxOrange)" />
  <polygon points="372,240 432,310 322,340" fill="url(#foxOrange)" />

  <!-- White Fur / Muzzle Cheeks (Geometric) -->
  <polygon points="190,340 80,310 160,390 256,360" fill="#FFFFFF" />
  <polygon points="322,340 432,310 352,390 256,360" fill="#F0F4F8" />
  <polygon points="160,390 256,360 256,430 210,430" fill="#E2E8F0" />
  <polygon points="352,390 256,360 256,430 302,430" fill="#CBD5E1" />

  <!-- Center Nose & Snout Bridge -->
  <polygon points="256,260 220,330 256,370 292,330" fill="url(#foxOrange)" />
  <polygon points="256,350 240,370 256,385 272,370" fill="#0A0E1A" />

  <!-- Tech Eyes / Glasses (Sleek WixFox Brand) -->
  <!-- Left Eye Frame -->
  <polygon points="180,245 235,245 220,285 170,280" fill="#0A0E1A" />
  <polygon points="185,250 228,250 216,280 176,276" fill="url(#blueAccent)" />
  <circle cx="205" cy="265" r="5" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="208" cy="262" r="2" fill="#FFFFFF" />

  <!-- Right Eye Frame -->
  <polygon points="332,245 277,245 292,285 342,280" fill="#0A0E1A" />
  <polygon points="327,250 284,250 296,280 336,276" fill="url(#blueAccent)" />
  <circle cx="307" cy="265" r="5" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="304" cy="262" r="2" fill="#FFFFFF" />

  <!-- Bridge connector -->
  <rect x="235" y="252" width="42" height="6" rx="3" fill="#0A0E1A" />

  <!-- Chest Neck Accent -->
  <polygon points="256,400 230,460 256,490 282,460" fill="#FFFFFF" />
  <polygon points="256,420 244,455 256,475 268,455" fill="url(#foxOrange)" opacity="0.8" />
</svg>
